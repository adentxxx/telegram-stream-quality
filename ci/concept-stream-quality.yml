name: Concept — stream quality & camera effects

on:
  push:
    branches: [ concept/stream-quality ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out submodules
        run: |
          # tgcalls is referenced relative to the upstream org; a fork has no copy of it.
          git config submodule.submodules/TgVoipWebrtc/tgcalls.url https://github.com/TelegramMessenger/tgcalls.git
          git submodule sync --recursive
          git -c submodule.submodules/TgVoipWebrtc/tgcalls.url=https://github.com/TelegramMessenger/tgcalls.git submodule update --init --recursive --depth 1 --jobs 8

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          if [ -d "/Applications/Xcode_$XCODE_VERSION.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_$XCODE_VERSION.app/Contents/Developer"
          else
            echo "Xcode $XCODE_VERSION is not installed, using the default one"
          fi
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Pick a simulator
        run: python3 .github/concept/pick_simulator.py

      - name: Restore Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ runner.os }}-${{ hashFiles('versions.json') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ hashFiles('versions.json') }}-

      - name: Report every compile error in one run
        run: echo "build --keep_going" >> .bazelrc

      - name: Build for the Simulator without provisioning profiles
        # The fake-codesigning profiles in the repo expired on 2026-10-30; a Simulator build
        # doesn't need them (same switch generateProject --disableProvisioningProfiles uses).
        run: |
          python3 - <<'PY'
          path = 'build-system/Make/Make.py'
          source = open(path).read()
          anchor = '    bazel_command_line.set_configuration(arguments.configuration)\n    if arguments.embedWatchApp:'
          assert anchor in source
          source = source.replace(anchor, "    bazel_command_line.set_configuration(arguments.configuration)\n    if arguments.configuration.endswith('sim_arm64'):\n        bazel_command_line.set_disable_provisioning_profiles()\n    if arguments.embedWatchApp:", 1)
          open(path, 'w').write(source)
          PY

      - name: Unit tests (TelegramCallsUI)
        run: |
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir="$HOME/telegram-bazel-cache" \
            test \
            --target //submodules/TelegramCallsUI:TelegramCallsUITests \
            --configurationPath build-system/appstore-configuration.json \
            --codesigningInformationPath build-system/fake-codesigning

      - name: Build the app for the Simulator
        if: success() || failure()
        run: |
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath build-system/appstore-configuration.json \
            --codesigningInformationPath build-system/fake-codesigning \
            --configuration=debug_sim_arm64 \
            --buildNumber=10000

      - name: Save Bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ runner.os }}-${{ hashFiles('versions.json') }}-${{ github.sha }}-${{ github.run_attempt }}

      - name: Collect the Simulator app
        if: success()
        run: |
          mkdir -p build/artifacts
          IPA=$(readlink -f bazel-bin)/Telegram/Telegram.ipa
          ls -la "$IPA"
          rm -rf build/unpacked && mkdir -p build/unpacked
          unzip -q "$IPA" -d build/unpacked
          # Payload/Telegram.app is a Simulator build: drag it onto a booted Simulator, or upload the zip to Appetize.
          (cd build/unpacked/Payload && ditto -c -k --sequesterRsrc --keepParent Telegram.app ../../artifacts/Telegram-Simulator.app.zip)
          ls -la build/artifacts

      - name: Upload the Simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Simulator
          path: build/artifacts
          retention-days: 14

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: bazel-testlogs/submodules/TelegramCallsUI/**/test.log
          if-no-files-found: ignore
